name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,forecast-classical,pattern-search-hnsw]" pytest ruff

      - name: Lint Python sources and tests
        run: ruff check src tests

      - name: Evaluate public tool schemas
        run: python scripts/schema_evaluate.py

      - name: Run backend tests
        run: python -m pytest tests

  foundation-smoke:
    name: Foundation forecast smoke (real Torch)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install foundation forecast dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[forecast-foundation]" pytest

      - name: Verify real foundation packages
        run: python -c "import chronos, torch; print(f'torch={torch.__version__} chronos={chronos.__version__}')"

      - name: Run real foundation inference smoke
        run: python -m pytest tests/forecast/test_foundation_real_smoke.py -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: webui

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
