[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtdata-mcp"
version = "0.1.0"
description = "MetaTrader5 MCP Server for market data retrieval and analysis."
authors = [
    {name = "Emerson Gomes", email = "emerson.gomes@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "MetaTrader5>=5.0.6090",
    # MCP 2 removed mcp.server.fastmcp (renamed to MCPServer).
    "mcp>=1.29.0,<2",
    "typing-extensions>=4.16.0",
    "python-dotenv>=1.2.3",
    "dateparser>=1.4.2",
    "tzlocal>=5.4.4",
    # StatsForecast, sktime, and MLForecast still require pandas<3.
    "pandas>=2.3.3,<3",
    # numpy 2.5+ still blocked by sktime 1.1.x (numba 0.67 allows numpy<2.6).
    "numpy>=2.4.6,<2.5",
    "pandas-ta-classic>=0.6.52",
    "holidays>=0.103",
    "scipy>=1.18.1",
    # sktime 1.1.x still requires scikit-learn<1.8.
    "scikit-learn>=1.7.2,<1.8",
    "hmmlearn>=0.3.3",
    "scikit-image>=0.26.0",
    "PyWavelets>=1.9.0",
    "EMD-signal>=1.10.0",
    "vmdpy>=0.2",
    # ruptures 1.1.x currently excludes real 3.14.x via requires_python / lacks cp314 wheels
    "ruptures>=1.0.6,<1.1.0",
    "statsmodels>=0.14.6",
    "tslearn>=0.9.0",
    "stumpy>=1.14.1",
    "finvizfinance>=1.3.0",
    "requests>=2.32.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtdata*"]

[project.optional-dependencies]
forecast-classical = [
    "arch>=8.0.0",
    "optuna>=4.9.0",
    "QuantLib>=1.43",
    # StatsForecast 2.1.1 is the first validated 2.x Windows/cp314 wheel.
    "statsforecast>=2.1.1,<3",
    "sktime>=1.1.0",
    "mlforecast>=1.1.0",
    "lightgbm>=4.7.0",
    "coreforecast>=0.0.18",
    "numba>=0.67.0",
    "tsfresh>=0.21.2",
]
forecast-foundation = [
    "torch>=2.13.0,<3",
    "pillow>=12.3.0",
    "accelerate>=1.14.0",
    "chronos-forecasting>=2.3.1",
    "transformers>=5.15.1,<6",
    "huggingface-hub>=1.28.0,<2",
]
forecast-timesfm = [
    "torch>=2.13.0,<3",
    "timesfm[torch]>=3.0.1,<4",
    "safetensors>=0.5.3",
]
patterns-ext = [
    # stock-pattern has no setup.py/pyproject.toml; manual install required (see docs/SETUP.md)
]
pattern-search-hnsw = [
    # Source-built on Windows/cp314; validated with MSVC Build Tools 2022.
    "hnswlib==0.8.0",
]
web = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]
news-embeddings = [
    "sentence-transformers>=5.7.0,<6",
    "huggingface-hub>=1.28.0,<2",
]
news-ycnbc = [
    "ycnbc>=1.0.12",
]
dimred-ext = [
    "umap-learn>=0.5.12",
]
all = [
    "arch>=8.0.0",
    "optuna>=4.9.0",
    "QuantLib>=1.43",
    "statsforecast>=2.1.1,<3",
    "sktime>=1.1.0",
    "mlforecast>=1.1.0",
    "lightgbm>=4.7.0",
    "coreforecast>=0.0.18",
    "numba>=0.67.0",
    "tsfresh>=0.21.2",
    "torch>=2.13.0,<3",
    "pillow>=12.3.0",
    "accelerate>=1.14.0",
    "chronos-forecasting>=2.3.1",
    "transformers>=5.15.1,<6",
    "huggingface-hub>=1.28.0,<2",
    "timesfm[torch]>=3.0.1,<4",
    "safetensors>=0.5.3",
    "tsdownsample>=0.1.5.1",
    "hnswlib==0.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sentence-transformers>=5.7.0,<6",
    "umap-learn>=0.5.12",
]
all-git = [
    "arch>=8.0.0",
    "optuna>=4.9.0",
    "QuantLib>=1.43",
    "statsforecast>=2.1.1,<3",
    "sktime>=1.1.0",
    "mlforecast>=1.1.0",
    "lightgbm>=4.7.0",
    "coreforecast>=0.0.18",
    "numba>=0.67.0",
    "tsfresh>=0.21.2",
    "torch>=2.13.0,<3",
    "pillow>=12.3.0",
    "accelerate>=1.14.0",
    "chronos-forecasting>=2.3.1",
    "transformers>=5.15.1,<6",
    "huggingface-hub>=1.28.0,<2",
    "timesfm[torch]>=3.0.1,<4",
    "safetensors>=0.5.3",
    "tsdownsample>=0.1.5.1",
    "hnswlib==0.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sentence-transformers>=5.7.0,<6",
    "umap-learn>=0.5.12",
    "ycnbc>=1.0.12",
]

[project.scripts]
mtdata-sse = "mtdata.core.server:main_sse"
mtdata-stdio = "mtdata.core.server:main_stdio"
# Alias so Official MCP Registry clients that compose `uvx mtdata-mcp` launch stdio.
mtdata-mcp = "mtdata.core.server:main_stdio"
mtdata-streamable-http = "mtdata.core.server:main_streamable_http"
mtdata-webapi = "mtdata.core.web_api:main_webapi"
mtdata-cli = "mtdata.core.cli:main"

[project.urls]
Homepage = "https://github.com/emerzon/mtdata-mcp"
Repository = "https://github.com/emerzon/mtdata-mcp"
Issues = "https://github.com/emerzon/mtdata-mcp/issues"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901"]
ignore = ["E402", "E501", "E701", "E702", "E741", "B904", "B905"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E731", "F401", "F841", "B007", "B017", "B023", "B028"]
"src/mtdata/**/__init__.py" = ["F401"]
"src/mtdata/core/regime/api.py" = ["F401"]
"src/mtdata/core/report/utils.py" = ["F401"]
"src/mtdata/core/web_api.py" = ["B008"]
"src/mtdata/core/server.py" = ["F401"]
"src/mtdata/core/schema_attach.py" = ["B023"]
"src/mtdata/utils/indicators.py" = ["B023"]


"src/mtdata/forecast/barriers_shared.py" = ["F401"]
"src/mtdata/forecast/forecast.py" = ["F401"]
"src/mtdata/patterns/classic.py" = ["F401"]
"src/mtdata/shared/constants.py" = ["F401"]
